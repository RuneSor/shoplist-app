<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Handleliste</title>
<style>
  :root {
    --bg: #f4f5f1; --card: #ffffff; --text: #1c231f; --muted: #6d766f;
    --line: #e3e6e0; --accent: #2f7d4f; --accent-ink: #ffffff; --danger: #b3412f;
    --radius: 14px; --pop: #ffffff; --pop-active: #e8f1eb; --pop-line: #e3e6e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121513; --card: #1c211e; --text: #e9ece9; --muted: #8e978f;
      --line: #2a302c; --accent: #4fa374; --accent-ink: #0d140f; --danger: #e0715d;
      --pop: #2b332e; --pop-active: #36443b; --pop-line: #3d4842;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 18px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  #count { color: var(--muted); font-size: 15px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  #langBtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1; display: grid; place-items: center; }
  #langBtn:active { background: var(--line); }

  main { padding: 0 14px calc(env(safe-area-inset-bottom) + 110px); max-width: 640px; margin: 0 auto; }

  #addForm { position: relative; display: flex; gap: 8px; margin: 4px 0 14px; }
  #addInput {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; outline: none;
  }
  #addInput:focus { border-color: var(--accent); }
  #addForm button {
    border: 0; border-radius: var(--radius); padding: 0 16px;
    background: var(--card); border: 1px solid var(--line); font-weight: 600;
  }

  /* Suggestions from previously scanned items, under the add field */
  /* Its own raised surface with an accent border, and the list behind is dimmed, so the two never blend */
  #suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    list-style: none; margin: 0; padding: 0; background: var(--pop); border: 1.5px solid var(--accent);
    border-radius: var(--radius); overflow: hidden; box-shadow: 0 14px 36px rgba(0,0,0,.35); }
  #suggest[hidden] { display: none; }
  /* Heading from the (translated) aria-label */
  #suggest::before { content: attr(aria-label); display: block; padding: 8px 12px 6px; font-size: 12px;
    font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
  .sug { display: flex; align-items: center; gap: 10px; padding: 8px 12px; min-height: 52px;
    border-top: 1px solid var(--pop-line); cursor: pointer; }
  .sug.active, .sug:active { background: var(--pop-active); }
  #list, #empty, #clearDone { transition: opacity .15s; }
  body.suggesting #list, body.suggesting #empty, body.suggesting #clearDone { opacity: .3; }
  .sug-name { flex: 1; min-width: 0; }
  .sug-name small { display: block; color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #list { list-style: none; margin: 0; padding: 0; background: var(--card);
    border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  #list:empty { display: none; }
  .item { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 12px;
    border-top: 1px solid var(--line); min-height: 56px; }
  .item:first-child { border-top: 0; }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted);
    background: none; padding: 0; display: grid; place-items: center;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check::after { content: ""; width: 7px; height: 12px; border: solid var(--accent-ink);
    border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .name { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 4px 0; }
  .name small { display: block; color: var(--muted); font-size: 12px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .thumb { flex: none; width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
    background: #fff; border: 1px solid var(--line); }
  .thumb-icon { display: grid; place-items: center; background: var(--bg); font-size: 20px; line-height: 1; }
  .item.done .thumb { opacity: .45; }
  .qty { display: flex; align-items: center; gap: 2px; }
  .item.done .qty { display: none; }
  .qty button, .del {
    width: 30px; height: 34px; border-radius: 10px; border: 0; background: none;
    font-size: 20px; line-height: 1; color: var(--muted);
  }
  .qty button:active, .del:active { background: var(--line); }
  .qty span { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .del { font-size: 22px; }

  .divider { padding: 8px 12px; font-size: 13px; color: var(--muted); background: var(--bg);
    border-top: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em; }

  #empty { text-align: center; color: var(--muted); margin: 48px 20px; }
  #version { margin: 28px 0 0; text-align: center; color: var(--muted); font-size: 11px; opacity: .7; }
  #version:empty { display: none; }
  #clearDone[hidden] { display: none; }   /* display: block would otherwise override [hidden] */
  #clearDone { display: block; margin: 16px auto 0; background: none; border: 0;
    color: var(--danger); font-weight: 600; padding: 10px; }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 15px 26px; font-weight: 700; font-size: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
  }
  .fab:active { transform: translateX(-50%) scale(.97); }
  .fab svg { width: 24px; height: 24px; }

  /* Scanner */
  #scanner { position: fixed; inset: 0; z-index: 50; background: #000; }
  #scanner[hidden] { display: none; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    width: min(82vw, 420px); aspect-ratio: 2.2 / 1; border-radius: 16px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.85);
    overflow: hidden;
  }
  .laser { position: absolute; left: 6%; right: 6%; height: 2px; background: #ff4b3e;
    box-shadow: 0 0 8px #ff4b3e; animation: sweep 1.6s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 12%; } to { top: 86%; } }
  .scan-top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff;
  }
  .scan-top span { font-size: 15px; opacity: .9; }
  #closeScan { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 18px; font-weight: 700; }
  .scan-actions { display: flex; align-items: center; gap: 8px; }
  #switchCam { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px;
    width: 40px; height: 40px; padding: 0; display: grid; place-items: center; }
  #switchCam[hidden] { display: none; }
  #switchCam svg { width: 22px; height: 22px; }
  .scan-info { margin-top: 6px; font-size: 12px; opacity: .6; }
  .scan-hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px);
    text-align: center; color: rgba(255,255,255,.75); font-size: 14px; padding: 0 24px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); z-index: 100;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: rgba(20,24,21,.92); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 600; max-width: 90vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Dialog */
  dialog {
    border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 380px);
    background: var(--card); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 20px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  #dlgImage { display: block; width: 100%; max-height: 38vh; object-fit: contain; margin: 0 0 14px;
    background: #fff; border-radius: 12px; }
  #dlgImage[hidden] { display: none; }
  #dlgName { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; outline: none; }
  #dlgName:focus { border-color: var(--accent); }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 16px 0 0; padding: 0; }
  dialog menu button { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; background: var(--line); }
  dialog menu button[value="ok"] { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>

<header>
  <h1 data-i18n="title">Handleliste</h1>
  <div class="head-right">
    <span id="count"></span>
    <button id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <form id="addForm" autocomplete="off">
    <input id="addInput" placeholder="Legg til vare…" enterkeyhint="done" aria-label="Ny vare"
           data-i18n-placeholder="addPlaceholder" data-i18n-aria="addAria"
           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
    <button type="submit" data-i18n="add">Legg til</button>
    <ul id="suggest" role="listbox" hidden aria-label="Tidligere skannede varer" data-i18n-aria="suggestAria"></ul>
  </form>

  <ul id="list"></ul>
  <p id="empty"><span data-i18n="empty1">Listen er tom.</span><br><span data-i18n="empty2">Skann en strekkode eller skriv inn en vare.</span></p>
  <button id="clearDone" hidden data-i18n="clearDone">Fjern avkryssede</button>
  <p id="version"></p>
</main>

<button id="scanBtn" class="fab" aria-label="Skann strekkode" data-i18n-aria="scanAria">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
    <path d="M7 8v8M10 8v8M13 8v8M17 8v8"/>
  </svg>
  <span data-i18n="scan">Skann vare</span>
</button>

<div id="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"><div class="laser"></div></div>
  <div class="scan-top">
    <span data-i18n="scanFrame">Hold strekkoden i rammen</span>
    <div class="scan-actions">
      <button id="switchCam" type="button" hidden aria-label="Bytt kamera" data-i18n-aria="switchCam">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/>
        </svg>
      </button>
      <button id="closeScan" data-i18n="scanDone">Ferdig</button>
    </div>
  </div>
  <div class="scan-hint">
    <span data-i18n="scanHint">Skann så mange varer du vil – trykk «Ferdig» når du er ferdig.</span>
    <div id="scanInfo" class="scan-info"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="nameDialog">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgSub"></p>
    <img id="dlgImage" alt="" crossorigin="anonymous" hidden>
    <input id="dlgName" placeholder="Navn på varen" data-i18n-placeholder="namePlaceholder" enterkeyhint="done" autocomplete="off">
    <menu>
      <button value="cancel" formnovalidate data-i18n="cancel">Avbryt</button>
      <button value="ok" data-i18n="save">Lagre</button>
    </menu>
  </form>
</dialog>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
"use strict";

/* ---------- Storage ---------- */
// Versioned keys: bump the suffix (and migrate in migrateStorage) on incompatible changes.
const LS_ITEMS = "handleliste.items_v1";
const LS_CODES = "handleliste.barcodes_v1";   // barcode -> name the user typed or renamed (wins over lookups)
const LS_LOOKUPS = "handleliste.lookups_v1";  // barcode -> { no, en, image, imageFull, category } from Open Food Facts
const IMAGE_ORIGIN = "https://images.openfoodfacts.org";
const LS_LANG = "handleliste.lang_v1";        // "no" | "en"
const LS_CAMERA = "handleliste.camera_v1";    // deviceId picked with "switch camera" (unset = automatic)
const LEGACY_KEYS = { [LS_ITEMS]: "handleliste.items", [LS_CODES]: "handleliste.barcodes" };

function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { console.warn("Could not save", e); return false; }
}
function storageRemove(key) {
  try { localStorage.removeItem(key); } catch {}
}

// Runs once at startup: moves data from the unversioned keys to the _v1 keys.
function migrateStorage() {
  for (const [key, legacy] of Object.entries(LEGACY_KEYS)) {
    const old = storageGet(legacy);
    if (old === null) continue;
    if (storageGet(key) === null && !storageSet(key, old)) continue;   // keep legacy data if the copy failed
    storageRemove(legacy);
  }
}

function load(key, fallback) {
  try { return JSON.parse(storageGet(key)) ?? fallback; } catch { return fallback; }
}

migrateStorage();
const state = {
  items: load(LS_ITEMS, []),
  codeMap: load(LS_CODES, {}),
  lookups: load(LS_LOOKUPS, {}),
  lang: storageGet(LS_LANG) || "no",
};

function save() {
  storageSet(LS_ITEMS, JSON.stringify(state.items));
  storageSet(LS_CODES, JSON.stringify(state.codeMap));
  storageSet(LS_LOOKUPS, JSON.stringify(state.lookups));
  storageSet(LS_LANG, state.lang);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Language ---------- */
// Add a language: one entry in LANGS (flag + name) and one in I18N with the same keys as "no".
const LANGS = {
  no: { flag: "🇳🇴", name: "Norsk" },
  en: { flag: "🇬🇧", name: "English" },
};
const I18N = {
  no: {
    title: "Handleliste",
    addPlaceholder: "Legg til vare…", addAria: "Ny vare", add: "Legg til",
    suggestAria: "Tidligere skannede varer",
    empty1: "Listen er tom.", empty2: "Skann en strekkode eller skriv inn en vare.",
    clearDone: "Fjern avkryssede", scan: "Skann vare", scanAria: "Skann strekkode",
    scanFrame: "Hold strekkoden i rammen", scanDone: "Ferdig",
    scanHint: "Skann så mange varer du vil – trykk «Ferdig» når du er ferdig.",
    namePlaceholder: "Navn på varen", cancel: "Avbryt", save: "Lagre",
    inCart: "I handlekurven", left: (n) => `${n} igjen`, allDone: "Alt handlet ✓",
    check: "Kryss av", uncheck: "Fjern avkrysning", fewer: "Færre", more: "Flere", del: "Slett",
    rename: "Endre navn", barcode: (c) => `Strekkode ${c}`,
    unknownTitle: "Ukjent vare", unknownSub: (c) => `Strekkode ${c} – navnet huskes til neste gang.`,
    looking: (c) => `Slår opp ${c}…`, notFound: "Fant ikke varen",
    added: (n) => `Lagt til: ${n}`, oneMore: (n) => `Én til: ${n}`,
    noLib: "Skanneren lastet ikke – sjekk nettet og prøv igjen",
    noCamPermission: "Appen fikk ikke bruke kameraet", noCam: "Klarte ikke å starte kameraet",
    langAria: (to) => `Språk: norsk. Bytt til ${to}`,
    switchCam: "Bytt kamera", version: (v) => `Versjon ${v}`,
    cat: {
      frozen: "Frysevarer", cheese: "Ost", eggs: "Egg", dairy: "Meieri", meat: "Kjøtt", fish: "Fisk og sjømat",
      bread: "Brød og bakevarer", beverages: "Drikke", snacks: "Snacks og godteri", fruit: "Frukt og bær",
      vegetables: "Grønnsaker", pantry: "Tørrvarer og hermetikk", condiments: "Saus og krydder", spreads: "Pålegg",
    },
  },
  en: {
    title: "Shopping List",
    addPlaceholder: "Add item…", addAria: "New item", add: "Add",
    suggestAria: "Previously scanned items",
    empty1: "Your list is empty.", empty2: "Scan a barcode or type an item.",
    clearDone: "Clear checked items", scan: "Scan item", scanAria: "Scan barcode",
    scanFrame: "Hold the barcode inside the frame", scanDone: "Done",
    scanHint: "Scan as many items as you like – tap “Done” when you’re finished.",
    namePlaceholder: "Item name", cancel: "Cancel", save: "Save",
    inCart: "In the cart", left: (n) => `${n} left`, allDone: "All done ✓",
    check: "Check off", uncheck: "Uncheck", fewer: "Fewer", more: "More", del: "Delete",
    rename: "Rename", barcode: (c) => `Barcode ${c}`,
    unknownTitle: "Unknown item", unknownSub: (c) => `Barcode ${c} – the name will be remembered next time.`,
    looking: (c) => `Looking up ${c}…`, notFound: "Product not found",
    added: (n) => `Added: ${n}`, oneMore: (n) => `One more: ${n}`,
    noLib: "The scanner didn’t load – check your connection and try again",
    noCamPermission: "The app wasn’t allowed to use the camera", noCam: "Couldn’t start the camera",
    langAria: (to) => `Language: English. Switch to ${to}`,
    switchCam: "Switch camera", version: (v) => `Version ${v}`,
    cat: {
      frozen: "Frozen", cheese: "Cheese", eggs: "Eggs", dairy: "Dairy", meat: "Meat", fish: "Fish & seafood",
      bread: "Bread & bakery", beverages: "Drinks", snacks: "Snacks & sweets", fruit: "Fruit & berries",
      vegetables: "Vegetables", pantry: "Pantry & canned", condiments: "Sauces & spices", spreads: "Spreads",
    },
  },
};
if (!I18N[state.lang]) state.lang = "no";

function t(key, ...args) {
  const v = I18N[state.lang][key] ?? I18N.no[key];
  return typeof v === "function" ? v(...args) : v;
}

function nextLang() {
  const codes = Object.keys(LANGS);
  return codes[(codes.indexOf(state.lang) + 1) % codes.length];
}

// Static text lives in the markup (Norwegian default); this re-applies it for the current language.
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  const btn = $("langBtn");
  btn.textContent = LANGS[state.lang].flag;
  btn.setAttribute("aria-label", t("langAria", LANGS[nextLang()].name));
  btn.title = LANGS[state.lang].name;
  render();
  showVersion();
}

// The version is the number in CACHE in sw.js ("handleliste-v9" -> 9), read from the cache the service worker
// has downloaded, so it also shows whether the phone has picked up a new version. Nothing is shown without one.
async function showVersion() {
  let v = 0;
  try {
    for (const key of await caches.keys()) v = Math.max(v, Number(key.match(/^handleliste-v(\d+)$/)?.[1] || 0));
  } catch {}   // no Cache API (file://, private mode)
  $("version").textContent = v ? t("version", v) : "";
}

/* ---------- Categories ---------- */
// Open Food Facts categories_tags run from general to specific ("en:beverages" ... "en:yogurts"), so the
// most specific tag is checked first. Each tag is split on "-" and matched word by word (singular or plural),
// plus two-word pairs, which keeps "salted-butters" out of "salt" and "champagnes" out of "ham". Rule order
// breaks ties within a tag: "fruit-yogurts" is dairy, "fruit-juices" a drink, "ice-creams" frozen,
// "tomato-sauces" a sauce. The two-word rules come first ("peanut-butters" is not dairy).
const CATEGORY_RULES = [
  ["spreads", "peanut-butter nut-butter hazelnut-spread chocolate-spread"],
  ["vegetables", "sweet-potato"],
  ["frozen", "frozen ice"],
  ["cheese", "cheese"],
  ["eggs", "egg"],
  ["dairy", "dairy dairie milk yogurt yoghurt cream butter kefir skyr quark curd"],
  ["meat", "meat beef pork chicken poultry ham sausage bacon salami lamb burger turkey mince"],
  ["fish", "fish seafood salmon cod tuna shrimp prawn mackerel herring sardine"],
  ["beverages", "beverage drink juice water soda coffee tea beer wine nectar smoothie"],
  ["snacks", "snack chocolate candy candie confectionerie biscuit cookie chip crisp"],
  ["bread", "bread bakery roll bun baguette crispbread flatbread cracker pastrie cake"],
  ["condiments", "sauce condiment spice dressing mayonnaise seasoning ketchup oil vinegar"],
  ["spreads", "spread jam honey marmalade pate"],
  ["fruit", "fruit apple banana berry berrie orange citru grape pear"],
  ["vegetables", "vegetable potato tomato salad carrot onion cabbage legume"],
  ["pantry", "pasta rice cereal flour grain noodle oat muesli canned"],
].map(([cat, words]) => [cat, new Set(words.split(" "))]);
const CATEGORY_ICONS = {
  frozen: "🧊", cheese: "🧀", eggs: "🥚", dairy: "🥛", meat: "🥩", fish: "🐟", beverages: "🥤", snacks: "🍫",
  bread: "🍞", condiments: "🧂", spreads: "🍯", fruit: "🍎", vegetables: "🥕", pantry: "🍝",
};
const DEFAULT_ICON = "🛒";

function classifyCategory(tags) {
  for (const tag of [...(tags || [])].reverse()) {
    const forms = (w) => [w, w.replace(/s$/, ""), w.replace(/es$/, "")];   // "jams" -> "jam", "potatoes" -> "potato"
    const tokens = tag.replace(/^[a-z]{2}:/, "").toLowerCase().split("-");
    const words = tokens.flatMap(forms);
    for (let k = 0; k < tokens.length - 1; k++) words.push(...forms(tokens[k + 1]).map((w) => `${tokens[k]}-${w}`));
    for (const [cat, keys] of CATEGORY_RULES) {
      if (words.some((w) => keys.has(w))) return cat;
    }
  }
  return null;
}

const categoryLabel = (cat) => (cat && I18N[state.lang].cat[cat]) || "";

// Display only: a no-break space between a number and its unit, so "600 g" never wraps between the two
const keepUnits = (name) => name.replace(/(\d) (?=(?:kg|g|l|dl|cl|ml|stk|pk|x)\b)/gi, "$1\u00a0");

/* ---------- List ---------- */
const $ = (id) => document.getElementById(id);
const listEl = $("list");

// Same open product = same barcode, or same name when at most one of them has a barcode.
// A typed "Melk" and a scanned "Melk" therefore merge; two different barcodes never do.
function findOpenMatch(name, barcode) {
  const lower = name.toLowerCase();
  return state.items.find((i) => !i.done && (
    (barcode && i.barcode === barcode) ||
    (i.name.toLowerCase() === lower && !(barcode && i.barcode))
  ));
}

function addItem(name, barcode = null) {
  name = name.trim();
  if (!name) return null;
  const existing = findOpenMatch(name, barcode);
  if (existing) {
    existing.qty++;
    if (barcode && !existing.barcode) existing.barcode = barcode;
  } else {
    state.items.unshift({ id: uid(), name, barcode, qty: 1, done: false });
  }
  save(); render();
  return existing ? "more" : "new";
}

function render() {
  listEl.replaceChildren();
  const open = state.items.filter((i) => !i.done);
  const done = state.items.filter((i) => i.done);

  open.forEach((i) => listEl.append(row(i)));
  if (done.length && open.length) {
    const d = document.createElement("li");
    d.className = "divider";
    d.textContent = t("inCart");
    listEl.append(d);
  }
  done.forEach((i) => listEl.append(row(i)));

  $("empty").hidden = state.items.length > 0;
  $("clearDone").hidden = done.length === 0;
  $("count").textContent = open.length ? t("left", open.length) : (state.items.length ? t("allDone") : "");
}

function row(i) {
  const li = document.createElement("li");
  li.className = "item" + (i.done ? " done" : "");
  li.dataset.id = i.id;

  const check = document.createElement("button");
  check.className = "check";
  check.dataset.action = "toggle";
  check.setAttribute("aria-label", i.done ? t("uncheck") : t("check"));

  const name = document.createElement("button");
  name.className = "name";
  name.dataset.action = "rename";
  name.textContent = keepUnits(i.name);
  const lookup = i.barcode ? state.lookups[i.barcode] : null;
  // Category first: if the line is too long, only the end of the barcode is cut off
  const meta = [categoryLabel(lookup?.category), i.barcode].filter(Boolean).join(" · ");
  if (meta) {
    const s = document.createElement("small");
    s.textContent = meta;
    name.append(s);
  }

  const qty = document.createElement("div");
  qty.className = "qty";
  qty.innerHTML = `<button data-action="dec">−</button><span></span><button data-action="inc">+</button>`;
  qty.querySelector("span").textContent = i.qty;
  qty.querySelector('[data-action="dec"]').setAttribute("aria-label", t("fewer"));
  qty.querySelector('[data-action="inc"]').setAttribute("aria-label", t("more"));

  const del = document.createElement("button");
  del.className = "del";
  del.dataset.action = "delete";
  del.setAttribute("aria-label", t("del"));
  del.textContent = "×";

  li.append(check, thumb(lookup), name, qty, del);
  return li;
}

// Product image, or the category icon when there is none (or it fails to load).
// Every row gets one, so names line up.
function thumb(lookup) {
  const icon = document.createElement("span");
  icon.className = "thumb thumb-icon";
  icon.setAttribute("aria-hidden", "true");
  icon.textContent = CATEGORY_ICONS[lookup?.category] || DEFAULT_ICON;
  if (!lookup?.image) return icon;

  const img = document.createElement("img");
  img.className = "thumb";
  img.crossOrigin = "anonymous";   // CORS response, so the service worker can cache it for offline use
  img.alt = "";                    // decorative: the name is right next to it
  img.loading = "lazy";
  img.decoding = "async";
  img.addEventListener("error", () => img.replaceWith(icon));
  img.src = lookup.image;
  return img;
}

listEl.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.closest(".item").dataset.id;
  const item = state.items.find((i) => i.id === id);
  if (!item) return;

  switch (btn.dataset.action) {
    case "toggle": item.done = !item.done; break;
    case "inc": item.qty++; break;
    case "dec": if (item.qty > 1) item.qty--; break;
    case "delete": state.items = state.items.filter((i) => i !== item); break;
    case "rename": {
      const lookup = item.barcode ? state.lookups[item.barcode] : null;
      const sub = [categoryLabel(lookup?.category), item.barcode && t("barcode", item.barcode)].filter(Boolean).join(" · ");
      const n = await askName({ title: t("rename"), sub, value: item.name, image: lookup?.imageFull || lookup?.image });
      if (!n) return;
      item.name = n;
      if (item.barcode) state.codeMap[item.barcode] = n;   // remember the new name next time
      break;
    }
  }
  save(); render();
});

/* ---------- Search in previously scanned items ---------- */
// The history is every barcode in codeMap and lookups; no storage of its own. The name is picked as in
// onCode (the user's own name wins), and both languages are searched. Items that would merge with an open
// item on the list are left out: they are already there.
const SUGGEST_MIN = 2, SUGGEST_MAX = 6;
const addInput = $("addInput"), suggestEl = $("suggest");
let suggestions = [], activeSug = -1;

function searchHistory(query) {
  const q = query.trim().toLowerCase();
  if (q.length < SUGGEST_MIN) return [];
  const codes = new Set([...Object.keys(state.codeMap), ...Object.keys(state.lookups)]);
  const hits = [];
  for (const code of codes) {
    const lookup = state.lookups[code] || null;
    const name = state.codeMap[code] || lookup?.[state.lang] || lookup?.no || lookup?.en;
    if (!name || findOpenMatch(name, code)) continue;
    const texts = [name, lookup?.no, lookup?.en].filter(Boolean).map((s) => s.toLowerCase());
    // 0: the name starts with the query, 1: a word does, 2: it is somewhere in the name
    const rank = texts.some((s) => s.startsWith(q)) ? 0
      : texts.some((s) => s.split(/[\s,.\-–()]+/).some((w) => w.startsWith(q))) ? 1
      : texts.some((s) => s.includes(q)) ? 2 : -1;
    if (rank >= 0) hits.push({ code, name, lookup, rank });
  }
  const locale = state.lang === "no" ? "nb" : state.lang;
  return hits.sort((a, b) => a.rank - b.rank || a.name.localeCompare(b.name, locale)).slice(0, SUGGEST_MAX);
}

function renderSuggestions() {
  suggestEl.replaceChildren(...suggestions.map((h, n) => {
    const li = document.createElement("li");
    li.className = "sug" + (n === activeSug ? " active" : "");
    li.id = `sug-${n}`;
    li.setAttribute("role", "option");
    li.setAttribute("aria-selected", String(n === activeSug));
    li.dataset.index = n;
    const text = document.createElement("div");
    text.className = "sug-name";
    text.textContent = keepUnits(h.name);
    const meta = [categoryLabel(h.lookup?.category), h.code].filter(Boolean).join(" · ");
    const s = document.createElement("small");
    s.textContent = meta;
    text.append(s);
    li.append(thumb(h.lookup), text);
    return li;
  }));
  const open = suggestions.length > 0;
  suggestEl.hidden = !open;
  document.body.classList.toggle("suggesting", open);
  addInput.setAttribute("aria-expanded", String(open));
  if (activeSug >= 0) addInput.setAttribute("aria-activedescendant", `sug-${activeSug}`);
  else addInput.removeAttribute("aria-activedescendant");
}

function updateSuggestions() {
  suggestions = searchHistory(addInput.value);
  activeSug = -1;
  renderSuggestions();
}

function closeSuggestions() {
  suggestions = [];
  activeSug = -1;
  renderSuggestions();
}

function pickSuggestion(n) {
  const h = suggestions[n];
  if (!h) return;
  const r = addItem(h.name, h.code);   // with the barcode, so it gets the image and category
  addInput.value = "";
  closeSuggestions();
  addInput.focus();   // keep the keyboard up for the next item
  toast(r === "more" ? t("oneMore", h.name) : t("added", h.name));
}

addInput.addEventListener("input", updateSuggestions);
addInput.addEventListener("focus", updateSuggestions);
// Delayed, so a tap on a suggestion is not lost when the field loses focus first
addInput.addEventListener("blur", () => setTimeout(() => {
  if (document.activeElement !== addInput) closeSuggestions();
}, 150));
addInput.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeSuggestions(); return; }
  if (!suggestions.length || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
  e.preventDefault();
  const step = e.key === "ArrowDown" ? 1 : -1;
  const slots = suggestions.length + 1;   // the options plus "none" (-1)
  activeSug = (activeSug + 1 + step + slots) % slots - 1;
  renderSuggestions();
});
suggestEl.addEventListener("pointerdown", (e) => e.preventDefault());   // keep focus in the field
suggestEl.addEventListener("click", (e) => {
  const li = e.target.closest(".sug");
  if (li) pickSuggestion(Number(li.dataset.index));
});

$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  // Enter adds what was typed, unless a suggestion was picked with the arrow keys
  if (activeSug >= 0) { pickSuggestion(activeSug); return; }
  if (addItem(addInput.value)) addInput.value = "";
  closeSuggestions();
});

$("clearDone").addEventListener("click", () => {
  state.items = state.items.filter((i) => !i.done);
  save(); render();
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 1800) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- Name dialog ---------- */
function askName({ title, sub = "", value = "", image = null }) {
  const dlg = $("nameDialog");
  $("dlgTitle").textContent = title;
  $("dlgSub").textContent = sub;
  $("dlgSub").hidden = !sub;
  const img = $("dlgImage");
  img.hidden = !image;
  if (image) {
    img.onerror = () => { img.hidden = true; };
    img.src = image;
  } else {
    img.removeAttribute("src");
  }
  const input = $("dlgName");
  input.value = value;
  dlg.returnValue = "";
  dlg.showModal();
  setTimeout(() => { input.focus(); input.select(); }, 50);
  return new Promise((resolve) => {
    dlg.addEventListener("close", () => {
      const v = input.value.trim();
      resolve(dlg.returnValue === "ok" && v ? v : null);
    }, { once: true });
  });
}
// Enter in the field saves
$("dlgName").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("nameDialog").close("ok"); }
});

/* ---------- Product lookup (Open Food Facts) ---------- */
async function lookupProduct(code) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json` +
                `?fields=product_name,product_name_nb,product_name_no,product_name_en,brands,` +
                `image_front_small_url,image_small_url,image_front_url,image_url,categories_tags`;
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const p = data.product;
    const brand = (p.brands || "").split(",")[0].trim();
    // Preferred name fields per language; each falls back to the other languages.
    const order = {
      no: [p.product_name_nb, p.product_name_no, p.product_name, p.product_name_en],
      en: [p.product_name_en, p.product_name, p.product_name_nb, p.product_name_no],
    };
    const names = {};
    for (const [lang, fields] of Object.entries(order)) {
      let name = (fields.find((f) => f && f.trim()) || "").trim();
      if (!name) return null;
      if (brand && !name.toLowerCase().includes(brand.toLowerCase())) name = `${brand} ${name}`;
      names[lang] = name;
    }
    // Front image in ~200 px (row) and ~400 px (rename dialog); only OFF's own image host is accepted
    const safe = (u) => (u && u.startsWith(IMAGE_ORIGIN + "/") ? u : null);
    names.image = safe(p.image_front_small_url || p.image_small_url);
    names.imageFull = safe(p.image_front_url || p.image_url);
    names.category = classifyCategory(p.categories_tags);
    return names;   // { no, en, image, imageFull, category }
  } catch {
    return null;   // offline, timeout, etc.
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- Scanner ---------- */
// The app opens the camera itself so it can pick the lens, then decodes with:
//  - the native BarcodeDetector where it exists (Chrome on Android): fast and tolerant of blur
//  - ZXing otherwise (iOS Safari)
const RETAIL_FORMATS = ["ean_13", "ean_8", "upc_a", "upc_e"];

let scan = null;      // { stream, decoder, cams, engine } while the scanner is open
let scanToken = 0;    // bumped on close, so a slow openScanner() can tell it was cancelled
let busy = false;
let lastCode = null, lastTime = 0;

async function createDetector() {
  if (!("BarcodeDetector" in window)) return null;
  try {
    const supported = await BarcodeDetector.getSupportedFormats();
    const formats = RETAIL_FORMATS.filter((f) => supported.includes(f));
    return formats.length ? new BarcodeDetector({ formats }) : null;
  } catch {
    return null;
  }
}

function openStream(deviceId) {
  const pick = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: { ideal: "environment" } };
  return navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { ...pick, width: { ideal: 1280 }, height: { ideal: 720 } },
  });
}

const stopStream = (stream) => stream?.getTracks().forEach((tr) => tr.stop());
const currentDeviceId = (stream) => stream.getVideoTracks()[0]?.getSettings().deviceId;

// Chrome on Android labels lenses "camera2 <id>, facing back". facingMode alone often gives an
// ultra-wide lens without autofocus, which can't read barcodes up close; the back camera with the
// lowest id is normally the main lens. Other platforms (iOS) keep the browser's choice.
function pickMainBackCamera(cams) {
  const back = cams
    .map((c) => ({ c, m: /camera2 (\d+), facing back/i.exec(c.label) }))
    .filter((x) => x.m)
    .sort((a, b) => Number(a.m[1]) - Number(b.m[1]));
  return back[0]?.c.deviceId ?? null;
}

async function enableContinuousFocus(stream) {
  const track = stream.getVideoTracks()[0];
  try {
    if (track?.getCapabilities?.().focusMode?.includes("continuous")) {
      await track.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
    }
  } catch { /* focus control is optional */ }
}

async function startCamera() {
  let chosen = storageGet(LS_CAMERA);
  let stream;
  try {
    stream = await openStream(chosen);
  } catch (err) {
    if (!chosen || err.name === "NotAllowedError") throw err;
    storageRemove(LS_CAMERA);   // the saved camera is gone; fall back to automatic
    chosen = null;
    stream = await openStream(null);
  }
  // Labels are only filled in once permission is granted, so enumerate after opening a stream
  const cams = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "videoinput");
  if (!chosen) {
    const main = pickMainBackCamera(cams);
    if (main && main !== currentDeviceId(stream)) {
      try {
        const better = await openStream(main);
        stopStream(stream);
        stream = better;
      } catch { /* keep the first stream */ }
    }
  }
  await enableContinuousFocus(stream);
  return { stream, cams };
}

// Polls the native detector; skips frames while a code is being handled
function startDetectorLoop(detector, video) {
  let stopped = false;
  (async () => {
    while (!stopped) {
      if (!busy && video.readyState >= 2) {
        try {
          const codes = await detector.detect(video);
          if (!stopped && codes.length) onCode(codes[0].rawValue);
        } catch { /* frame not ready */ }
      }
      await new Promise((r) => setTimeout(r, 120));
    }
  })();
  return { stop: () => { stopped = true; } };
}

async function openScanner() {
  const token = ++scanToken;
  const detector = await createDetector();
  if (!detector && !window.ZXingBrowser) {
    toast(t("noLib"), 3000);
    return;
  }
  $("scanner").hidden = false;
  $("switchCam").hidden = true;
  $("scanInfo").textContent = "";
  let stream;
  try {
    const cam = await startCamera();
    stream = cam.stream;
    if (token !== scanToken) { stopStream(stream); return; }   // closed while starting

    const video = $("video");
    let decoder;
    if (detector) {
      video.srcObject = stream;
      await video.play().catch(() => {});
      decoder = startDetectorLoop(detector, video);
    } else {
      // 1D-only reader: retail barcodes, less work per frame than the multi-format reader
      const reader = new ZXingBrowser.BrowserMultiFormatOneDReader();
      decoder = await reader.decodeFromStream(stream, video, (result) => { if (result) onCode(result.getText()); });
    }
    if (token !== scanToken) { decoder.stop(); stopStream(stream); return; }

    scan = { stream, decoder, cams: cam.cams, engine: detector ? "BarcodeDetector" : "ZXing" };
    $("switchCam").hidden = cam.cams.length < 2;
    const label = stream.getVideoTracks()[0]?.label || "";
    $("scanInfo").textContent = [scan.engine, label].filter(Boolean).join(" · ");
  } catch (err) {
    stopStream(stream);
    closeScanner();
    toast(err && err.name === "NotAllowedError"
      ? t("noCamPermission")
      : t("noCam"), 3000);
    console.error(err);
  }
}

function closeScanner() {
  scanToken++;
  if (scan) {
    try { scan.decoder.stop(); } catch {}
    stopStream(scan.stream);
  }
  scan = null;
  $("video").srcObject = null;
  $("scanner").hidden = true;
}

// Cycles through the cameras (front ones last) and remembers the choice
function switchCamera() {
  if (!scan) return;
  const front = (c) => /front|facing front/i.test(c.label);
  const cams = [...scan.cams.filter((c) => !front(c)), ...scan.cams.filter(front)];
  const i = cams.findIndex((c) => c.deviceId === currentDeviceId(scan.stream));
  const next = cams[(i + 1) % cams.length];
  storageSet(LS_CAMERA, next.deviceId);
  closeScanner();
  openScanner();
}

async function onCode(code) {
  const now = Date.now();
  // Avoid registering the same code repeatedly while it stays in view
  if (busy || (code === lastCode && now - lastTime < 2500)) return;
  busy = true;
  lastCode = code;
  navigator.vibrate?.(60);

  try {
    // A name the user typed wins; then a cached lookup in the current language; then the network.
    let name = state.codeMap[code] || state.lookups[code]?.[state.lang];
    if (!name) {
      toast(t("looking", code), 6000);
      const names = await lookupProduct(code);
      if (names) {
        state.lookups[code] = names;
        name = names[state.lang];
      } else {
        toast(t("notFound"), 1200);
        name = await askName({ title: t("unknownTitle"), sub: t("unknownSub", code) });
        if (name) state.codeMap[code] = name;
      }
    }
    if (name) {
      const r = addItem(name, code);   // addItem saves
      toast(r === "more" ? t("oneMore", name) : t("added", name));
    }
  } finally {
    lastTime = Date.now();
    busy = false;
  }
}

$("scanBtn").addEventListener("click", openScanner);
$("langBtn").addEventListener("click", () => {
  state.lang = nextLang();
  save();
  applyLanguage();
});
$("closeScan").addEventListener("click", closeScanner);
$("switchCam").addEventListener("click", switchCamera);
document.addEventListener("visibilitychange", () => { if (document.hidden && !$("scanner").hidden) closeScanner(); });

// Lookups saved before images/categories existed lack the "category" key: fetch those again for items on
// the list (names stay as they are). Products that are no longer found are simply retried next start.
async function refreshOldLookups() {
  if (!navigator.onLine) return;
  const codes = [...new Set(state.items.map((i) => i.barcode))]
    .filter((c) => c && state.lookups[c] && !("category" in state.lookups[c]));
  let changed = false;
  for (const code of codes.slice(0, 20)) {
    const fresh = await lookupProduct(code);
    if (!fresh) continue;
    Object.assign(state.lookups[code], { image: fresh.image, imageFull: fresh.imageFull, category: fresh.category });
    changed = true;
  }
  if (changed) { save(); render(); }
}

/* ---------- Startup ---------- */
applyLanguage();   // also renders
refreshOldLookups();
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(showVersion).catch(console.warn));
  navigator.serviceWorker.addEventListener("controllerchange", showVersion);
}
</script>
