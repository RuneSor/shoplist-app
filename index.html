<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7d4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Handleliste">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Handleliste</title>
<style>
  :root {
    --bg: #f4f5f1; --card: #ffffff; --text: #1c231f; --muted: #6d766f;
    --line: #e3e6e0; --accent: #2f7d4f; --accent-ink: #ffffff; --danger: #b3412f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121513; --card: #1c211e; --text: #e9ece9; --muted: #8e978f;
      --line: #2a302c; --accent: #4fa374; --accent-ink: #0d140f; --danger: #e0715d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; cursor: pointer; }

  header {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 14px) 18px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  #count { color: var(--muted); font-size: 15px; }
  .head-right { display: flex; align-items: center; gap: 10px; }
  #langBtn { border: 1px solid var(--line); background: var(--card); border-radius: 999px;
    width: 40px; height: 40px; padding: 0; font-size: 22px; line-height: 1; display: grid; place-items: center; }
  #langBtn:active { background: var(--line); }

  main { padding: 0 14px calc(env(safe-area-inset-bottom) + 110px); max-width: 640px; margin: 0 auto; }

  #addForm { display: flex; gap: 8px; margin: 4px 0 14px; }
  #addInput {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; outline: none;
  }
  #addInput:focus { border-color: var(--accent); }
  #addForm button {
    border: 0; border-radius: var(--radius); padding: 0 16px;
    background: var(--card); border: 1px solid var(--line); font-weight: 600;
  }

  #list { list-style: none; margin: 0; padding: 0; background: var(--card);
    border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
  #list:empty { display: none; }
  .item { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 12px;
    border-top: 1px solid var(--line); min-height: 56px; }
  .item:first-child { border-top: 0; }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted);
    background: none; padding: 0; display: grid; place-items: center;
  }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check::after { content: ""; width: 7px; height: 12px; border: solid var(--accent-ink);
    border-width: 0 2.5px 2.5px 0; transform: translateY(-1px) rotate(45deg); }
  .name { flex: 1; min-width: 0; background: none; border: 0; text-align: left; padding: 4px 0; }
  .name small { display: block; color: var(--muted); font-size: 12px; }
  .item.done .name { color: var(--muted); text-decoration: line-through; }
  .qty { display: flex; align-items: center; gap: 2px; }
  .item.done .qty { display: none; }
  .qty button, .del {
    width: 34px; height: 34px; border-radius: 10px; border: 0; background: none;
    font-size: 20px; line-height: 1; color: var(--muted);
  }
  .qty button:active, .del:active { background: var(--line); }
  .qty span { min-width: 20px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
  .del { font-size: 22px; }

  .divider { padding: 8px 12px; font-size: 13px; color: var(--muted); background: var(--bg);
    border-top: 1px solid var(--line); text-transform: uppercase; letter-spacing: .05em; }

  #empty { text-align: center; color: var(--muted); margin: 48px 20px; }
  #clearDone { display: block; margin: 16px auto 0; background: none; border: 0;
    color: var(--danger); font-weight: 600; padding: 10px; }

  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom) + 18px); z-index: 10;
    display: flex; align-items: center; gap: 10px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 15px 26px; font-weight: 700; font-size: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,.22);
  }
  .fab:active { transform: translateX(-50%) scale(.97); }
  .fab svg { width: 24px; height: 24px; }

  /* Scanner */
  #scanner { position: fixed; inset: 0; z-index: 50; background: #000; }
  #scanner[hidden] { display: none; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    width: min(82vw, 420px); aspect-ratio: 2.2 / 1; border-radius: 16px;
    box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); border: 2px solid rgba(255,255,255,.85);
    overflow: hidden;
  }
  .laser { position: absolute; left: 6%; right: 6%; height: 2px; background: #ff4b3e;
    box-shadow: 0 0 8px #ff4b3e; animation: sweep 1.6s ease-in-out infinite alternate; }
  @keyframes sweep { from { top: 12%; } to { top: 86%; } }
  .scan-top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #fff;
  }
  .scan-top span { font-size: 15px; opacity: .9; }
  #closeScan { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 999px;
    padding: 9px 18px; font-weight: 700; }
  .scan-hint { position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 28px);
    text-align: center; color: rgba(255,255,255,.75); font-size: 14px; padding: 0 24px; }

  #toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 96px); z-index: 100;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: rgba(20,24,21,.92); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 15px; font-weight: 600; max-width: 90vw; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transition: opacity .2s, transform .2s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* Dialog */
  dialog {
    border: 0; border-radius: 18px; padding: 20px; width: min(92vw, 380px);
    background: var(--card); color: var(--text); box-shadow: 0 20px 50px rgba(0,0,0,.35);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 4px; font-size: 20px; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  #dlgName { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; outline: none; }
  #dlgName:focus { border-color: var(--accent); }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; margin: 16px 0 0; padding: 0; }
  dialog menu button { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; background: var(--line); }
  dialog menu button[value="ok"] { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>

<header>
  <h1 data-i18n="title">Handleliste</h1>
  <div class="head-right">
    <span id="count"></span>
    <button id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <form id="addForm" autocomplete="off">
    <input id="addInput" placeholder="Legg til vare…" enterkeyhint="done" aria-label="Ny vare"
           data-i18n-placeholder="addPlaceholder" data-i18n-aria="addAria">
    <button type="submit" data-i18n="add">Legg til</button>
  </form>

  <ul id="list"></ul>
  <p id="empty"><span data-i18n="empty1">Listen er tom.</span><br><span data-i18n="empty2">Skann en strekkode eller skriv inn en vare.</span></p>
  <button id="clearDone" hidden data-i18n="clearDone">Fjern avkryssede</button>
</main>

<button id="scanBtn" class="fab" aria-label="Skann strekkode" data-i18n-aria="scanAria">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/>
    <path d="M7 8v8M10 8v8M13 8v8M17 8v8"/>
  </svg>
  <span data-i18n="scan">Skann vare</span>
</button>

<div id="scanner" hidden>
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"><div class="laser"></div></div>
  <div class="scan-top">
    <span data-i18n="scanFrame">Hold strekkoden i rammen</span>
    <button id="closeScan" data-i18n="scanDone">Ferdig</button>
  </div>
  <div class="scan-hint" data-i18n="scanHint">Skann så mange varer du vil – trykk «Ferdig» når du er ferdig.</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="nameDialog">
  <form method="dialog">
    <h2 id="dlgTitle"></h2>
    <p id="dlgSub"></p>
    <input id="dlgName" placeholder="Navn på varen" data-i18n-placeholder="namePlaceholder" enterkeyhint="done" autocomplete="off">
    <menu>
      <button value="cancel" formnovalidate data-i18n="cancel">Avbryt</button>
      <button value="ok" data-i18n="save">Lagre</button>
    </menu>
  </form>
</dialog>

<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js"></script>
<script>
"use strict";

/* ---------- Storage ---------- */
// Versioned keys: bump the suffix (and migrate in migrateStorage) on incompatible changes.
const LS_ITEMS = "handleliste.items_v1";
const LS_CODES = "handleliste.barcodes_v1";   // barcode -> name the user typed or renamed (wins over lookups)
const LS_LOOKUPS = "handleliste.lookups_v1";  // barcode -> { no, en } names from Open Food Facts
const LS_LANG = "handleliste.lang_v1";        // "no" | "en"
const LEGACY_KEYS = { [LS_ITEMS]: "handleliste.items", [LS_CODES]: "handleliste.barcodes" };

function storageGet(key) {
  try { return localStorage.getItem(key); } catch { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch (e) { console.warn("Could not save", e); return false; }
}
function storageRemove(key) {
  try { localStorage.removeItem(key); } catch {}
}

// Runs once at startup: moves data from the unversioned keys to the _v1 keys.
function migrateStorage() {
  for (const [key, legacy] of Object.entries(LEGACY_KEYS)) {
    const old = storageGet(legacy);
    if (old === null) continue;
    if (storageGet(key) === null && !storageSet(key, old)) continue;   // keep legacy data if the copy failed
    storageRemove(legacy);
  }
}

function load(key, fallback) {
  try { return JSON.parse(storageGet(key)) ?? fallback; } catch { return fallback; }
}

migrateStorage();
const state = {
  items: load(LS_ITEMS, []),
  codeMap: load(LS_CODES, {}),
  lookups: load(LS_LOOKUPS, {}),
  lang: storageGet(LS_LANG) || "no",
};

function save() {
  storageSet(LS_ITEMS, JSON.stringify(state.items));
  storageSet(LS_CODES, JSON.stringify(state.codeMap));
  storageSet(LS_LOOKUPS, JSON.stringify(state.lookups));
  storageSet(LS_LANG, state.lang);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- Language ---------- */
// Add a language: one entry in LANGS (flag + name) and one in I18N with the same keys as "no".
const LANGS = {
  no: { flag: "🇳🇴", name: "Norsk" },
  en: { flag: "🇬🇧", name: "English" },
};
const I18N = {
  no: {
    title: "Handleliste",
    addPlaceholder: "Legg til vare…", addAria: "Ny vare", add: "Legg til",
    empty1: "Listen er tom.", empty2: "Skann en strekkode eller skriv inn en vare.",
    clearDone: "Fjern avkryssede", scan: "Skann vare", scanAria: "Skann strekkode",
    scanFrame: "Hold strekkoden i rammen", scanDone: "Ferdig",
    scanHint: "Skann så mange varer du vil – trykk «Ferdig» når du er ferdig.",
    namePlaceholder: "Navn på varen", cancel: "Avbryt", save: "Lagre",
    inCart: "I handlekurven", left: (n) => `${n} igjen`, allDone: "Alt handlet ✓",
    check: "Kryss av", uncheck: "Fjern avkrysning", fewer: "Færre", more: "Flere", del: "Slett",
    rename: "Endre navn", barcode: (c) => `Strekkode ${c}`,
    unknownTitle: "Ukjent vare", unknownSub: (c) => `Strekkode ${c} – navnet huskes til neste gang.`,
    looking: (c) => `Slår opp ${c}…`, notFound: "Fant ikke varen",
    added: (n) => `Lagt til: ${n}`, oneMore: (n) => `Én til: ${n}`,
    noLib: "Skanneren lastet ikke – sjekk nettet og prøv igjen",
    noCamPermission: "Appen fikk ikke bruke kameraet", noCam: "Klarte ikke å starte kameraet",
    langAria: (to) => `Språk: norsk. Bytt til ${to}`,
  },
  en: {
    title: "Shopping List",
    addPlaceholder: "Add item…", addAria: "New item", add: "Add",
    empty1: "Your list is empty.", empty2: "Scan a barcode or type an item.",
    clearDone: "Clear checked items", scan: "Scan item", scanAria: "Scan barcode",
    scanFrame: "Hold the barcode inside the frame", scanDone: "Done",
    scanHint: "Scan as many items as you like – tap “Done” when you’re finished.",
    namePlaceholder: "Item name", cancel: "Cancel", save: "Save",
    inCart: "In the cart", left: (n) => `${n} left`, allDone: "All done ✓",
    check: "Check off", uncheck: "Uncheck", fewer: "Fewer", more: "More", del: "Delete",
    rename: "Rename", barcode: (c) => `Barcode ${c}`,
    unknownTitle: "Unknown item", unknownSub: (c) => `Barcode ${c} – the name will be remembered next time.`,
    looking: (c) => `Looking up ${c}…`, notFound: "Product not found",
    added: (n) => `Added: ${n}`, oneMore: (n) => `One more: ${n}`,
    noLib: "The scanner didn’t load – check your connection and try again",
    noCamPermission: "The app wasn’t allowed to use the camera", noCam: "Couldn’t start the camera",
    langAria: (to) => `Language: English. Switch to ${to}`,
  },
};
if (!I18N[state.lang]) state.lang = "no";

function t(key, ...args) {
  const v = I18N[state.lang][key] ?? I18N.no[key];
  return typeof v === "function" ? v(...args) : v;
}

function nextLang() {
  const codes = Object.keys(LANGS);
  return codes[(codes.indexOf(state.lang) + 1) % codes.length];
}

// Static text lives in the markup (Norwegian default); this re-applies it for the current language.
function applyLanguage() {
  document.documentElement.lang = state.lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach((el) => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  const btn = $("langBtn");
  btn.textContent = LANGS[state.lang].flag;
  btn.setAttribute("aria-label", t("langAria", LANGS[nextLang()].name));
  btn.title = LANGS[state.lang].name;
  render();
}

/* ---------- List ---------- */
const $ = (id) => document.getElementById(id);
const listEl = $("list");

// Same open product = same barcode, or same name when at most one of them has a barcode.
// A typed "Melk" and a scanned "Melk" therefore merge; two different barcodes never do.
function findOpenMatch(name, barcode) {
  const lower = name.toLowerCase();
  return state.items.find((i) => !i.done && (
    (barcode && i.barcode === barcode) ||
    (i.name.toLowerCase() === lower && !(barcode && i.barcode))
  ));
}

function addItem(name, barcode = null) {
  name = name.trim();
  if (!name) return null;
  const existing = findOpenMatch(name, barcode);
  if (existing) {
    existing.qty++;
    if (barcode && !existing.barcode) existing.barcode = barcode;
  } else {
    state.items.unshift({ id: uid(), name, barcode, qty: 1, done: false });
  }
  save(); render();
  return existing ? "more" : "new";
}

function render() {
  listEl.replaceChildren();
  const open = state.items.filter((i) => !i.done);
  const done = state.items.filter((i) => i.done);

  open.forEach((i) => listEl.append(row(i)));
  if (done.length && open.length) {
    const d = document.createElement("li");
    d.className = "divider";
    d.textContent = t("inCart");
    listEl.append(d);
  }
  done.forEach((i) => listEl.append(row(i)));

  $("empty").hidden = state.items.length > 0;
  $("clearDone").hidden = done.length === 0;
  $("count").textContent = open.length ? t("left", open.length) : (state.items.length ? t("allDone") : "");
}

function row(i) {
  const li = document.createElement("li");
  li.className = "item" + (i.done ? " done" : "");
  li.dataset.id = i.id;

  const check = document.createElement("button");
  check.className = "check";
  check.dataset.action = "toggle";
  check.setAttribute("aria-label", i.done ? t("uncheck") : t("check"));

  const name = document.createElement("button");
  name.className = "name";
  name.dataset.action = "rename";
  name.textContent = i.name;
  if (i.barcode) {
    const s = document.createElement("small");
    s.textContent = i.barcode;
    name.append(s);
  }

  const qty = document.createElement("div");
  qty.className = "qty";
  qty.innerHTML = `<button data-action="dec">−</button><span></span><button data-action="inc">+</button>`;
  qty.querySelector("span").textContent = i.qty;
  qty.querySelector('[data-action="dec"]').setAttribute("aria-label", t("fewer"));
  qty.querySelector('[data-action="inc"]').setAttribute("aria-label", t("more"));

  const del = document.createElement("button");
  del.className = "del";
  del.dataset.action = "delete";
  del.setAttribute("aria-label", t("del"));
  del.textContent = "×";

  li.append(check, name, qty, del);
  return li;
}

listEl.addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-action]");
  if (!btn) return;
  const id = btn.closest(".item").dataset.id;
  const item = state.items.find((i) => i.id === id);
  if (!item) return;

  switch (btn.dataset.action) {
    case "toggle": item.done = !item.done; break;
    case "inc": item.qty++; break;
    case "dec": if (item.qty > 1) item.qty--; break;
    case "delete": state.items = state.items.filter((i) => i !== item); break;
    case "rename": {
      const n = await askName({ title: t("rename"), sub: item.barcode ? t("barcode", item.barcode) : "", value: item.name });
      if (!n) return;
      item.name = n;
      if (item.barcode) state.codeMap[item.barcode] = n;   // remember the new name next time
      break;
    }
  }
  save(); render();
});

$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("addInput");
  if (addItem(input.value)) input.value = "";
});

$("clearDone").addEventListener("click", () => {
  state.items = state.items.filter((i) => !i.done);
  save(); render();
});

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 1800) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- Name dialog ---------- */
function askName({ title, sub = "", value = "" }) {
  const dlg = $("nameDialog");
  $("dlgTitle").textContent = title;
  $("dlgSub").textContent = sub;
  $("dlgSub").hidden = !sub;
  const input = $("dlgName");
  input.value = value;
  dlg.returnValue = "";
  dlg.showModal();
  setTimeout(() => { input.focus(); input.select(); }, 50);
  return new Promise((resolve) => {
    dlg.addEventListener("close", () => {
      const v = input.value.trim();
      resolve(dlg.returnValue === "ok" && v ? v : null);
    }, { once: true });
  });
}
// Enter in the field saves
$("dlgName").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("nameDialog").close("ok"); }
});

/* ---------- Product lookup (Open Food Facts) ---------- */
async function lookupProduct(code) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  try {
    const url = `https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json` +
                `?fields=product_name,product_name_nb,product_name_no,product_name_en,brands`;
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) return null;
    const data = await res.json();
    if (data.status !== 1 || !data.product) return null;
    const p = data.product;
    const brand = (p.brands || "").split(",")[0].trim();
    // Preferred name fields per language; each falls back to the other languages.
    const order = {
      no: [p.product_name_nb, p.product_name_no, p.product_name, p.product_name_en],
      en: [p.product_name_en, p.product_name, p.product_name_nb, p.product_name_no],
    };
    const names = {};
    for (const [lang, fields] of Object.entries(order)) {
      let name = (fields.find((f) => f && f.trim()) || "").trim();
      if (!name) return null;
      if (brand && !name.toLowerCase().includes(brand.toLowerCase())) name = `${brand} ${name}`;
      names[lang] = name;
    }
    return names;   // { no, en }
  } catch {
    return null;   // offline, timeout, etc.
  } finally {
    clearTimeout(timer);
  }
}

/* ---------- Scanner ---------- */
let controls = null;
let busy = false;
let lastCode = null, lastTime = 0;

async function openScanner() {
  if (!window.ZXingBrowser) {
    toast(t("noLib"), 3000);
    return;
  }
  $("scanner").hidden = false;
  try {
    const reader = new ZXingBrowser.BrowserMultiFormatReader();
    controls = await reader.decodeFromConstraints(
      { audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } },
      $("video"),
      (result) => { if (result) onCode(result.getText()); }
    );
  } catch (err) {
    closeScanner();
    toast(err && err.name === "NotAllowedError"
      ? t("noCamPermission")
      : t("noCam"), 3000);
    console.error(err);
  }
}

function closeScanner() {
  try { controls?.stop(); } catch {}
  controls = null;
  $("scanner").hidden = true;
}

async function onCode(code) {
  const now = Date.now();
  // Avoid registering the same code repeatedly while it stays in view
  if (busy || (code === lastCode && now - lastTime < 2500)) return;
  busy = true;
  lastCode = code;
  navigator.vibrate?.(60);

  try {
    // A name the user typed wins; then a cached lookup in the current language; then the network.
    let name = state.codeMap[code] || state.lookups[code]?.[state.lang];
    if (!name) {
      toast(t("looking", code), 6000);
      const names = await lookupProduct(code);
      if (names) {
        state.lookups[code] = names;
        name = names[state.lang];
      } else {
        toast(t("notFound"), 1200);
        name = await askName({ title: t("unknownTitle"), sub: t("unknownSub", code) });
        if (name) state.codeMap[code] = name;
      }
    }
    if (name) {
      const r = addItem(name, code);   // addItem saves
      toast(r === "more" ? t("oneMore", name) : t("added", name));
    }
  } finally {
    lastTime = Date.now();
    busy = false;
  }
}

$("scanBtn").addEventListener("click", openScanner);
$("langBtn").addEventListener("click", () => {
  state.lang = nextLang();
  save();
  applyLanguage();
});
$("closeScan").addEventListener("click", closeScanner);
document.addEventListener("visibilitychange", () => { if (document.hidden && controls) closeScanner(); });

/* ---------- Startup ---------- */
applyLanguage();   // also renders
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(console.warn));
}
</script>
</body>
</html>
